[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-analytics-ai"
version = "0.1.0"
description = "Vehicle detection, multi-object tracking, and traffic analytics"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.7.0",
    "torchvision==0.22.0",
    "ultralytics>=8.4,<9",
    "opencv-python>=4.10",
    "pandas>=2.2",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]